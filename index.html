                let currentGroup = '';
                let sidebarHidden = false;
                function init() {
                    const groupNames = Object.keys(folderGroupsData);
                    console.log("Folder groups:", folderGroupsData);
                    if (groupNames.length > 0) {
                        currentGroup = groupNames[0];
                    }
                    buildTopNav(groupNames);
                    if (currentGroup) {
                        setActiveGroup(currentGroup);
                    }
                }
                function buildTopNav(groupNames) {
                    const topNavGroups = document.getElementById('topNavGroups');
                    topNavGroups.innerHTML = '';
                    groupNames.forEach(name => {
                        const btn = document.createElement('button');
                        btn.classList.add('top-nav-button');
                        btn.textContent = name;
                        btn.onclick = () => setActiveGroup(name);
                        topNavGroups.appendChild(btn);
                    });
                    const groupsDropdown = document.getElementById('groupsDropdown');
                    groupsDropdown.innerHTML = '';
                    groupNames.forEach(name => {
                        const a = document.createElement('a');
                        a.href = "#";
                        a.textContent = name;
                        a.onclick = (e) => {
                            e.preventDefault();
                            setActiveGroup(name);
                            toggleGroupsDropdown();
                        };
                        groupsDropdown.appendChild(a);
                    });
                }
                function setActiveGroup(groupName) {
                    currentGroup = groupName;
                    const sidebar = document.getElementById('sidebar');
                    sidebar.classList.remove('hidden');
                    sidebarHidden = false;
                    const allButtons = document.querySelectorAll('.top-nav-button');
                    allButtons.forEach(btn => {
                        btn.classList.remove('active');
                        if (btn.textContent === groupName) {
                            btn.classList.add('active');
                        }
                    });
                    buildSidebarSubfolders(folderGroupsData[groupName]);
                    clearSearch();
                    const subfolders = folderGroupsData[groupName];
                    if (subfolders.length > 0) {
                        const firstItem = subfolders[0];
                        const folderId = firstItem.title.replace(/\s+/g, '_') + '_nav';
                        if (firstItem.type === 'link') {
                            loadExternalLink(firstItem.value, folderId);
                        } else {
                            const page = firstItem.title.replace(/\s+/g, '_') + '.html';
                            loadContent(page, folderId);
                        }
                    }
                }
                function buildSidebarSubfolders(subfolderList) {
                    const subfolderContainer = document.getElementById('subfolderContainer');
                    const sidebarHeading = document.getElementById('sidebarHeading');
                    subfolderContainer.innerHTML = '';
                    sidebarHeading.textContent = 'مجلدات ' + currentGroup;
                    subfolderList.forEach(item => {
                        const title = item.title;
                        const type = item.type;
                        const value = item.value;
                        const folderId = title.replace(/\s+/g, '_');
                        const btn = document.createElement('div');
                        btn.classList.add('sidebar-subfolder-button');
                        btn.textContent = title;
                        btn.id = folderId + '_nav';
                        if (type === 'link') {
                            btn.onclick = () => loadExternalLink(value, btn.id);
                        } else {
                            btn.onclick = () => loadContent(folderId + '.html', btn.id);
                        }
                        const copyButton = document.createElement('button');
                        copyButton.textContent = 'نسخ';
                        copyButton.classList.add('copy-link-button');
                        copyButton.onclick = (e) => {
                            e.stopPropagation();
                            copyToClipboard(value);
                            highlightButton(btn.id);
                        };
                        btn.appendChild(copyButton);
                        subfolderContainer.appendChild(btn);
                    });
                }
                function loadExternalLink(url, buttonId) {
                    document.getElementById('loadingOverlay').style.display = 'flex';
                    const iframe = document.getElementById('mainFrame');
                    iframe.src = url;
                    highlightButton(buttonId);
                    const sidebar = document.getElementById('sidebar');
                    sidebar.classList.add('hidden');
                    sidebarHidden = true;
                }
                function loadContent(page, buttonId) {
                    document.getElementById('loadingOverlay').style.display = 'flex';
                    const iframe = document.getElementById('mainFrame');
                    iframe.src = page;
                    highlightButton(buttonId);
                }
                function highlightButton(buttonId) {
                    const buttons = document.querySelectorAll('.sidebar-subfolder-button');
                    buttons.forEach(btn => btn.classList.remove('active'));
                    const selected = document.getElementById(buttonId);
                    if (selected) {
                        selected.classList.add('active');
                    }
                }
                function filterSidebar() {
                    const input = document.getElementById('searchInput');
                    const clearButton = document.getElementById('clearButton');
                    const filterValue = input.value.toLowerCase();
                    clearButton.classList.toggle('visible', filterValue !== '');
                    const subfolders = document.querySelectorAll('.sidebar-subfolder-button');
                    subfolders.forEach(folder => {
                        const text = folder.textContent.toLowerCase();
                        folder.style.display = text.includes(filterValue) ? '' : 'none';
                    });
                }
                function clearSearch() {
                    const input = document.getElementById('searchInput');
                    input.value = '';
                    document.getElementById('clearButton').classList.remove('visible');
                    filterSidebar();
                }
                function toggleSidebar() {
                    const sidebar = document.getElementById('sidebar');
                    sidebar.classList.toggle('hidden');
                    sidebarHidden = !sidebarHidden;
                }
                function copyToClipboard(text) {
                    navigator.clipboard.writeText(text).then(() => {
                        console.log('تم نسخ الرابط: ' + text);
                    }).catch(err => {
                        console.error('فشل نسخ الرابط: ', err);
                    });
                }
                function scrollGroups(direction) {
                    const container = document.getElementById('topNavGroups');
                    const scrollAmount = 150;
                    if (direction === 'left') {
                        container.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
                    } else if (direction === 'right') {
                        container.scrollBy({ left: scrollAmount, behavior: 'smooth' });
                    }
                }
                function toggleGroupsDropdown() {
                    const dropdown = document.getElementById('groupsDropdown');
                    dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
                }
                window.onload = () => {
                    init();
                    document.getElementById('mainFrame').onload = function() {
                        document.getElementById('loadingOverlay').style.display = 'none';
                    };
                };
            </script>
