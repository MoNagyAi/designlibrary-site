
        <html>
        <head>
            <meta charset="UTF-8">
            <title>درايف الكورسات المدفوعة</title>
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600&display=swap" rel="stylesheet">
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
            <style>
                body {
                    font-family: Arial, sans-serif;
                    margin: 0;
                    padding: 20px;
                    background-color: #f4f7fa;
                }
                .grid-container {
                    display: grid;
                    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                    gap: 20px;
                }
                .grid-item {
                    background-color: #ffffff;
                    border-radius: 10px;
                    box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                    padding: 20px;
                    text-align: center;
                    transition: transform 0.3s ease, box-shadow 0.3s ease;
                }
                .grid-item:hover {
                    transform: translateY(-5px);
                    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
                }
                .grid-item a {
                    display: inline-block;
                    margin: 5px 10px;
                    padding: 10px 15px;
                    text-decoration: none;
                    color: white;
                    background-color: #3498db;
                    border-radius: 5px;
                    transition: background-color 0.3s ease, transform 0.3s ease;
                }
                .grid-item a:hover {
                    background-color: #2980b9;
                    transform: scale(1.05);
                }
                
        /* تنسيق زر التواصل الدائري */
        #contactButtonContainer {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
        }
        #contactButton {
            background-color: #25d366;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-size: 28px;
        }
        #contactMenu {
            display: none;
            margin-top: 10px;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #contactMenu a {
            display: block;
            padding: 8px 12px;
            color: #333;
            text-decoration: none;
            border-bottom: 1px solid #eee;
        }
        #contactMenu a:last-child {
            border-bottom: none;
        }
        #contactMenu a:hover {
            background-color: #f0f0f0;
        }
        
            </style>
        </head>
        <body>
            <h1 style="text-align:center;">درايف الكورسات المدفوعة</h1>
            <div class="grid-container">
                
            <div class="grid-item">
                <a href="كورسات_مدغوعة.html">كورسات مدغوعة</a>
            </div>
            
            </div>
            
        <div id="contactButtonContainer">
            <div id="contactButton"><i class="fab fa-whatsapp"></i></div>
            <div id="contactMenu">
                <a href="https://wa.me/yourNumber" target="_blank">WhatsApp</a>
                <a href="https://youtube.com/yourChannel" target="_blank">YouTube</a>
                <a href="https://facebook.com/yourPage" target="_blank">Facebook</a>
            </div>
        </div>
        <script>
        document.addEventListener('DOMContentLoaded', function() {
            var contactButton = document.getElementById('contactButton');
            var contactMenu = document.getElementById('contactMenu');
            contactButton.addEventListener('click', function(event) {
                event.stopPropagation();
                contactMenu.style.display = contactMenu.style.display === 'block' ? 'none' : 'block';
            });
            document.addEventListener('click', function(event) {
                if (contactMenu.style.display === 'block') {
                    contactMenu.style.display = 'none';
                }
            });
        });
        </script>
        
        </body>
        </html>
